[package]
name = "consus-launcher"
version = "1.2.0"
description = "Consus Launcher"
authors = ["Consus Industries"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "consus_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["macos-private-api"] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# native-roots trusts the OS store (corporate CAs); system-proxy honors OS proxy settings.
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots", "http2", "system-proxy"] }
# Platform backends are opt-in; without them keyring silently uses a mock store.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
# Already in the tree via Tauri's build tooling; format-preserving edits to config.toml.
toml_edit = "=0.25.15"
# Already in the tree via reqwest; app icons travel to the webview as data URLs.
base64 = "=0.23.1"
# Both already in the tree via reqwest's TLS stack; the sign-in's PKCE
# challenge (sha256) and one-time secret (32 random bytes).
sha2 = "=0.10.9"
getrandom = "=0.3.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
